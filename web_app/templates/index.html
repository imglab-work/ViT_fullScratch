<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViT 手書き数字分類</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f2f5; }
        .container { margin-top: 50px; }
        canvas { 
            border: 5px solid #333; 
            background-color: #000; 
            cursor: crosshair;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .controls { margin-top: 20px; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 5px;
            border-radius: 5px;
            border: none;
            transition: 0.2s;
        }
        .btn-clear { background-color: #e74c3c; color: white; }
        .btn-predict { background-color: #2ecc71; color: white; }
        button:hover { opacity: 0.8; }
        #result-area { margin-top: 30px; font-size: 24px; font-weight: bold; color: #333; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>ViT Digit Classifier</h1>
    <p>枠内に数字（0-9）を大きく書いてください</p>
    
    <canvas id="digitCanvas" width="280" height="280"></canvas>
    
    <div class="controls">
        <button class="btn-clear" onclick="clearCanvas()">クリア</button>
        <button class="btn-predict" onclick="predict()">予測する</button>
    </div>

    <div id="result-area">
        <span class="result-label">AI PREDICTION</span>
        <div id="prediction">-</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('digitCanvas');
    const ctx = canvas.getContext('2d');
    const predictionText = document.getElementById('prediction');
    let drawing = false;

    // キャンバスを黒で初期化
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 描画設定
    ctx.strokeStyle = "white";
    ctx.lineWidth = 18; // ViTが認識しやすいように少し太め
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // マウスイベント
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    // タッチイベント（スマホ対応）
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });

    function startDrawing(e) {
        drawing = true;
        draw(e);
    }

    function draw(e) {
        if (!drawing) return;
        
        // キャンバスの座標を取得
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.pageX) - rect.left;
        const y = (e.clientY || e.pageY) - rect.top;

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    function stopDrawing() {
        drawing = false;
        ctx.beginPath();
    }

    function clearCanvas() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        predictionText.innerText = "-";
    }

    async function predict() {
        predictionText.innerText = "推論中...";
        
        // CanvasのデータをBase64形式で取得
        const dataURL = canvas.toDataURL('image/png');

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: dataURL })
            });
            
            const result = await response.json();
            if (result.prediction !== undefined) {
                predictionText.innerText = result.prediction;
            } else {
                predictionText.innerText = "エラー";
            }
        } catch (error) {
            console.error("Error:", error);
            predictionText.innerText = "通信失敗";
        }
    }
</script>

</body>
</html>
